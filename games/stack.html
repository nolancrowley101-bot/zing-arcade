<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Stack · ZING!</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { overflow: hidden; height: 100vh; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; }
  .bar { pointer-events: none; } .bar > * { pointer-events: auto; }
  #msg {
    position: fixed; left: 50%; top: 22%; transform: translateX(-50%); font-size: 34px; font-weight: 900;
    pointer-events: none; opacity: 0; z-index: 4; color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.3), 0 0 20px rgba(56,225,255,.8);
  }
  #msg.bump { animation: m .6s ease-out; }
  @keyframes m { 0% { opacity: 1; transform: translateX(-50%) scale(1.5); } 100% { opacity: 0; transform: translateX(-50%) translateY(-30px) scale(1); } }
</style>
</head>
<body>
<canvas id="c" class="stage"></canvas>
<div class="bar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🧱 Stack</h1>
  <div class="stat"><small>Height</small><b id="score">0</b></div>
  <div class="stat"><small>Best</small><b id="best">0</b></div>
  <button class="icon-btn" id="mute"></button>
</div>
<div id="msg"></div>

<div class="overlay show" id="start">
  <div class="panel">
    <h2>🧱 Stack</h2>
    <p>Tap, click or press <b>Space</b> to drop the block.<br>Land it perfectly to keep your width, and after a few perfects it grows back!</p>
    <button class="btn" id="go">Start</button>
  </div>
</div>
<div class="overlay" id="end">
  <div class="panel">
    <h2>Tower fell!</h2>
    <div class="big" id="final">0</div>
    <p id="endmsg"></p>
    <button class="btn" id="again">Try again</button>
  </div>
</div>

<script src="../js/common.js"></script>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  let W, H, dpr;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  const BH = 34;                 // block height
  const START_W = () => Math.min(260, W * 0.62);
  let blocks, cur, falling, particles, camY, targetCam, state, score, streak, dir, speed, hueBase, flash;
  $('best').textContent = Arcade.best('stack');

  const color = (i, l = 58) => `hsl(${(hueBase + i * 9) % 360} 85% ${l}%)`;

  function reset() {
    hueBase = Math.random() * 360;
    const w = START_W();
    blocks = [{ x: W / 2 - w / 2, w, i: 0 }];
    falling = []; particles = []; score = 0; streak = 0; camY = 0; targetCam = 0; flash = 0;
    $('score').textContent = 0;
    nextBlock();
    state = 'play';
  }
  function nextBlock() {
    const top = blocks[blocks.length - 1];
    dir = Math.random() < .5 ? 1 : -1;
    speed = Math.min(220 + blocks.length * 9, 620);
    cur = { x: dir > 0 ? -top.w : W, w: top.w, i: blocks.length };
  }

  function say(t) { const m = $('msg'); m.textContent = t; m.classList.remove('bump'); void m.offsetWidth; m.classList.add('bump'); }

  function drop() {
    if (state !== 'play') return;
    const top = blocks[blocks.length - 1];
    const left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w);
    const overlap = right - left;
    if (overlap <= 0) { // total miss
      falling.push({ x: cur.x, w: cur.w, i: cur.i, y: yOf(cur.i), vy: 0, vx: 0, rot: 0, vr: dir * 1.2 });
      return gameOver();
    }
    const diff = Math.abs(cur.x - top.x);
    if (diff < 5) {
      // PERFECT: snap, keep width, maybe grow
      streak++;
      let w = top.w, x = top.x;
      if (streak >= 3 && w < START_W()) { const g = Math.min(10, START_W() - w); x -= g / 2; w += g; }
      blocks.push({ x, w, i: cur.i });
      flash = 1;
      const rows = Math.min(streak, 8);
      Arcade.note(rows + 1, 0.3, 'triangle', 0.2);
      Arcade.note(rows + 6, 0.2, 'sine', 0.08);
      say(streak > 1 ? `PERFECT x${streak}` : 'PERFECT');
      burst(x + w / 2, yOf(cur.i), w);
    } else {
      streak = 0;
      // trim and drop the overhang
      if (cur.x < top.x) falling.push({ x: cur.x, w: top.x - cur.x, i: cur.i, y: yOf(cur.i), vy: 0, vx: -40, rot: 0, vr: -.6 });
      else falling.push({ x: top.x + top.w, w: cur.x + cur.w - (top.x + top.w), i: cur.i, y: yOf(cur.i), vy: 0, vx: 40, rot: 0, vr: .6 });
      blocks.push({ x: left, w: overlap, i: cur.i });
      Arcade.tone(180, 0.1, 'square', 0.1, 90);
      Arcade.note(2, 0.14, 'sine', 0.16);
    }
    score++; $('score').textContent = score;
    targetCam = Math.max(0, (blocks.length - 6) * BH);
    nextBlock();
  }

  function burst(cx, y, w) {
    for (let i = 0; i < 18; i++) {
      particles.push({ x: cx + (Math.random() - .5) * w, y, vx: (Math.random() - .5) * 240, vy: -80 - Math.random() * 220, t: 0, life: .6 + Math.random() * .4, i: cur.i });
    }
  }

  function gameOver() {
    state = 'over';
    const nb = Arcade.setBest('stack', score);
    $('best').textContent = Arcade.best('stack');
    $('final').textContent = score;
    $('endmsg').innerHTML = nb ? '<span class="badge-new">NEW BEST!</span>' : 'Best: ' + Arcade.best('stack');
    Arcade.tone(300, 0.5, 'sawtooth', 0.12, 60);
    setTimeout(() => $('end').classList.add('show'), 700);
  }

  const yOf = i => H - 110 - (i + 1) * BH;   // world->screen (before camera)

  function frame(dt) {
    if (state === 'play') {
      cur.x += dir * speed * dt;
      const top = blocks[blocks.length - 1];
      if (cur.x + cur.w > W + 20) dir = -1; // bounce
      if (cur.x < -20) dir = 1;
    }
    camY += (targetCam - camY) * Math.min(1, dt * 5);
    for (const f of falling) { f.vy += 1800 * dt; f.y += f.vy * dt; f.x += f.vx * dt; f.rot += f.vr * dt; }
    falling = falling.filter(f => f.y < H + camY + 300);
    for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; }
    particles = particles.filter(p => p.t < p.life);
    flash = Math.max(0, flash - dt * 3);

    // background tint shifts with height
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${(hueBase + score * 4 + 240) % 360} 60% 14%)`);
    g.addColorStop(1, `hsl(${(hueBase + score * 4 + 300) % 360} 70% 26%)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.save(); ctx.translate(0, camY);
    const drawBlock = (b, y) => {
      ctx.fillStyle = color(b.i); ctx.fillRect(b.x, y, b.w, BH - 2);
      ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(b.x, y, b.w, 6);
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(b.x, y + BH - 8, b.w, 6);
    };
    for (const b of blocks) drawBlock(b, yOf(b.i));
    if (state === 'play') drawBlock(cur, yOf(cur.i));
    for (const f of falling) {
      ctx.save(); ctx.translate(f.x + f.w / 2, f.y + BH / 2); ctx.rotate(f.rot); ctx.translate(-f.w / 2, -BH / 2);
      ctx.globalAlpha = .9; drawBlock({ x: 0, w: f.w, i: f.i }, 0); ctx.restore();
    }
    for (const p of particles) {
      ctx.fillStyle = `hsla(${(hueBase + p.i * 9) % 360},90%,75%,${1 - p.t / p.life})`;
      ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    if (flash > 0 && blocks.length) {
      const t = blocks[blocks.length - 1];
      ctx.strokeStyle = `rgba(255,255,255,${flash})`; ctx.lineWidth = 3 + flash * 8;
      ctx.strokeRect(t.x - flash * 8, yOf(t.i) - flash * 8, t.w + flash * 16, BH + flash * 16 - 2);
    }
    ctx.restore();
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.min((now - last) / 1000, .04); last = now;
    if (blocks) frame(dt);
    requestAnimationFrame(loop);
  })(last);

  function begin() { $('start').classList.remove('show'); $('end').classList.remove('show'); reset(); Arcade.chord([0, 4, 7], .35); }
  $('go').onclick = begin; $('again').onclick = begin;
  cv.addEventListener('pointerdown', drop);
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (state === 'play') drop(); else if (state === 'over' && $('end').classList.contains('show')) begin(); }
  });

  // demo tower behind the start screen
  hueBase = 200; state = 'idle'; camY = targetCam = 0; flash = 0; falling = []; particles = [];
  blocks = []; for (let i = 0; i < 7; i++) { const w = 220 - i * 10; blocks.push({ x: W / 2 - w / 2 + Math.sin(i) * 14, w, i }); }
})();
</script>
</body>
</html>
