<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Brick Bash · ZING!</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { overflow: hidden; height: 100vh; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: none; }
  .bar { pointer-events: none; } .bar > * { pointer-events: auto; }
  #combo {
    position: fixed; left: 50%; top: 74px; transform: translateX(-50%); font-size: 34px; font-weight: 900; color: var(--yellow);
    text-shadow: 0 4px 0 rgba(0,0,0,.3), 0 0 24px rgba(255,210,63,.6); pointer-events: none; opacity: 0; z-index: 4; white-space: nowrap;
  }
  #combo.bump { animation: bump .3s cubic-bezier(.2,1.6,.4,1); opacity: 1; }
  @keyframes bump { from { transform: translateX(-50%) scale(1.5); } to { transform: translateX(-50%) scale(1); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🧱 Brick Bash</h1>
  <div class="stat"><small>Level</small><b id="lvl">1</b></div>
  <div class="stat"><small>Lives</small><b id="lives">3</b></div>
  <div class="stat"><small>Score</small><b id="score">0</b></div>
  <button class="icon-btn" id="mute"></button>
</div>
<div id="combo"></div>

<div class="overlay show" id="start">
  <div class="panel">
    <h2>🧱 Brick Bash</h2>
    <p>Move the mouse / finger (or ← →) to steer the paddle. Click, tap or press Space to launch.<br>Smash bricks without touching the paddle to build a combo!</p>
    <button class="btn" id="go">Start</button>
  </div>
</div>
<div class="overlay" id="end">
  <div class="panel">
    <h2>Game over</h2>
    <div class="big" id="final">0</div>
    <p id="endmsg"></p>
    <button class="btn" id="again">Play again</button>
  </div>
</div>

<script src="../js/common.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  let W, H, dpr;
  function resize() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); layout(); }
  const HUES = [340, 25, 50, 130, 190, 260, 300];
  let bricks = [], ball, paddle, parts = [], trail = [], state = 'idle', level = 1, lives = 3, score = 0, combo = 0, bestCombo = 0, shake = 0;

  function layout() {
    paddle = paddle || { x: W / 2, w: 120, h: 14, y: 0 };
    paddle.w = Math.max(90, Math.min(160, W * 0.16)); paddle.y = H - 54;
    if (state === 'idle' || state === 'ready') buildBricks();
  }
  function buildBricks() {
    bricks = [];
    const cols = W < 520 ? 7 : 10, rowsN = Math.min(4 + level, 10), m = 16, gap = 5, top = 96;
    const bw = (W - 2 * m - (cols - 1) * gap) / cols, bh = Math.min(26, Math.max(18, H * .035));
    for (let r = 0; r < rowsN; r++) for (let c = 0; c < cols; c++) {
      bricks.push({ x: m + c * (bw + gap), y: top + r * (bh + gap), w: bw, h: bh, hue: HUES[(r + level) % HUES.length], alive: true, row: r });
    }
  }
  resize(); addEventListener('resize', resize);

  const speedFor = () => Math.min(360 + level * 35, 720);
  function serve() {
    ball = { x: paddle.x, y: paddle.y - 10, r: 8, vx: 0, vy: 0, stuck: true };
    trail = []; combo = 0; state = 'ready';
  }
  function launch() {
    if (state !== 'ready') return;
    const a = (Math.random() - .5) * .8, s = speedFor();
    ball.vx = Math.sin(a) * s; ball.vy = -Math.cos(a) * s; ball.stuck = false; state = 'play';
    Arcade.pop(1.3);
  }
  function hud() { $('lvl').textContent = level; $('lives').textContent = lives; $('score').textContent = score; }

  // input
  let target = null; const keys = {};
  const setX = x => { target = x; };
  cv.addEventListener('pointermove', e => setX(e.clientX));
  cv.addEventListener('pointerdown', e => { setX(e.clientX); launch(); });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (state === 'ready') launch(); else if ($('end').classList.contains('show')) begin(); }
    keys[e.key] = true;
  });
  addEventListener('keyup', e => { keys[e.key] = false; });

  function say(t) { const c = $('combo'); c.textContent = t; c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }

  function breakBrick(b) {
    b.alive = false; combo++; bestCombo = Math.max(bestCombo, combo);
    const pts = 10 * Math.min(combo, 12); score += pts; hud();
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    for (let i = 0; i < 12; i++) { const a = Math.random() * 6.28, s = 80 + Math.random() * 240; parts.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, t: 0, hue: b.hue, sz: 3 + Math.random() * 4 }); }
    Arcade.note(Math.min(combo - 1, 18), .2, 'triangle', .17); Arcade.pop(1 + Math.min(combo, 12) * .04);
    shake = Math.min(6, 1 + combo * .3);
    if (combo >= 4) say(combo + 'x COMBO');
    if (!bricks.some(x => x.alive)) levelClear();
  }
  function levelClear() {
    state = 'between'; Arcade.chord([0, 2, 4, 7, 9], .5); say('LEVEL CLEAR!');
    score += 100 * level; hud();
    setTimeout(() => { level++; buildBricks(); serve(); hud(); }, 1500);
  }
  function lose() {
    lives--; hud(); Arcade.tone(260, .4, 'sawtooth', .1, 70);
    if (lives <= 0) {
      state = 'over';
      const nb = Arcade.setBest('bricks', score);
      $('final').textContent = score;
      $('endmsg').innerHTML = (nb && score ? '<span class="badge-new">NEW BEST!</span> ' : '') + `Level ${level} · Best combo ${bestCombo}` + (nb ? '' : ' · Best: ' + Arcade.best('bricks'));
      setTimeout(() => $('end').classList.add('show'), 500);
    } else serve();
  }

  function physics(dt) {
    const sp = Math.hypot(ball.vx, ball.vy), n = Math.max(1, Math.ceil(sp * dt / 4)), h = dt / n;
    for (let i = 0; i < n && state === 'play'; i++) {
      ball.x += ball.vx * h; ball.y += ball.vy * h;
      if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); Arcade.tone(300, .04, 'sine', .06); }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); Arcade.tone(300, .04, 'sine', .06); }
      if (ball.y < 64 + ball.r) { ball.y = 64 + ball.r; ball.vy = Math.abs(ball.vy); Arcade.tone(340, .04, 'sine', .06); }
      // paddle
      if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 10 && Math.abs(ball.x - paddle.x) <= paddle.w / 2 + ball.r) {
        const hit = Math.max(-1, Math.min(1, (ball.x - paddle.x) / (paddle.w / 2))), a = hit * 1.05, s = Math.min(sp * 1.01, 760);
        ball.vx = Math.sin(a) * s; ball.vy = -Math.cos(a) * s; ball.y = paddle.y - ball.r;
        combo = 0; Arcade.tone(220, .08, 'triangle', .14, 330);
      }
      // bricks
      for (const b of bricks) {
        if (!b.alive) continue;
        const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w)), cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
        const dx = ball.x - cx, dy = ball.y - cy;
        if (dx * dx + dy * dy <= ball.r * ball.r) {
          if (Math.abs(dx) > Math.abs(dy)) ball.vx = dx > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx); else ball.vy = dy > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
          breakBrick(b); break;
        }
      }
      if (ball.y - ball.r > H) { lose(); break; }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > .2) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    for (const b of bricks) {
      if (!b.alive) continue;
      const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h); g.addColorStop(0, `hsl(${b.hue} 90% 66%)`); g.addColorStop(1, `hsl(${b.hue} 80% 48%)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(b.x, b.y, b.w, b.h, 6) : ctx.rect(b.x, b.y, b.w, b.h); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(b.x + 3, b.y + 2, b.w - 6, 3);
    }
    for (const p of parts) { ctx.fillStyle = `hsla(${p.hue},90%,70%,${Math.max(0, 1 - p.t / .7)})`; ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz); }
    // paddle
    const pg = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h); pg.addColorStop(0, '#fff'); pg.addColorStop(1, '#38e1ff');
    ctx.save(); ctx.shadowColor = '#38e1ff'; ctx.shadowBlur = 18; ctx.fillStyle = pg; ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 8) : ctx.rect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h); ctx.fill(); ctx.restore();
    if (ball) {
      for (let i = 0; i < trail.length; i++) { const t = trail[i]; ctx.fillStyle = `rgba(255,255,255,${i / trail.length * .35})`; ctx.beginPath(); ctx.arc(t.x, t.y, ball.r * (i / trail.length), 0, 6.2832); ctx.fill(); }
      ctx.save(); ctx.shadowColor = '#fff'; ctx.shadowBlur = 20; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 6.2832); ctx.fill(); ctx.restore();
    }
    if (state === 'ready') { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '700 16px "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Tap / click / Space to launch', W / 2, paddle.y - 40); }
    ctx.restore();
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.min((now - last) / 1000, .033); last = now;
    if (keys.ArrowLeft || keys.a) target = (target ?? paddle.x) - 620 * dt;
    if (keys.ArrowRight || keys.d) target = (target ?? paddle.x) + 620 * dt;
    if (target != null) { target = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, target)); paddle.x += (target - paddle.x) * Math.min(1, dt * 28); }
    if (ball) {
      if (ball.stuck) { ball.x = paddle.x; ball.y = paddle.y - ball.r - 2; }
      else if (state === 'play') { physics(dt); trail.push({ x: ball.x, y: ball.y }); if (trail.length > 10) trail.shift(); }
    }
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; }
    parts = parts.filter(p => p.t < .7); shake *= .85;
    draw(); requestAnimationFrame(loop);
  })(last);

  function begin() { level = 1; lives = 3; score = 0; combo = 0; bestCombo = 0; parts = []; $('start').classList.remove('show'); $('end').classList.remove('show'); buildBricks(); serve(); hud(); }
  $('go').onclick = begin; $('again').onclick = begin;
  buildBricks();
})();
</script>
</body>
</html>
