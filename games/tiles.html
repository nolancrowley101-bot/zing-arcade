<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Beat Tiles · ZING!</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { overflow: hidden; height: 100vh; user-select: none; touch-action: none; }
  .field { position: fixed; left: 50%; top: 0; bottom: 0; width: min(100vw, 460px); transform: translateX(-50%); }
  #c { width: 100%; height: 100%; display: block; touch-action: none; }
  .bar { position: relative; z-index: 6; pointer-events: none; } .bar > * { pointer-events: auto; }
</style>
</head>
<body>
<div class="field"><canvas id="c"></canvas></div>
<div class="bar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🎹 Beat Tiles</h1>
  <div class="stat"><small>Score</small><b id="score">0</b></div>
  <div class="stat"><small>Best</small><b id="best">0</b></div>
  <button class="icon-btn" id="mute"></button>
</div>

<div class="overlay show" id="start">
  <div class="panel">
    <h2>🎹 Beat Tiles</h2>
    <p>Tap the glowing tiles from the bottom up. Each tap plays the next note of a melody.<br>Don’t tap empty space, and don’t let a tile escape!</p>
    <p>Keyboard: <b>D F J K</b></p>
    <button class="btn" id="go">Start</button>
  </div>
</div>
<div class="overlay" id="end">
  <div class="panel">
    <h2>Missed!</h2>
    <div class="big" id="final">0</div>
    <p id="endmsg"></p>
    <button class="btn" id="again">Play again</button>
  </div>
</div>

<script src="../js/common.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  let W, H, dpr, rowH;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2); const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); rowH = H / 4.3;
  }
  addEventListener('resize', resize); resize();
  $('best').textContent = Arcade.best('tiles');

  const HUES = [330, 190, 90, 45];
  let rows, next, scroll, speed, score, state = 'idle', flash, melody, mi, fx, bad, t0;
  function newRow() { return { col: (Math.random() * 4) | 0, hit: false, hitT: 0 }; }

  function reset() {
    rows = []; for (let i = 0; i < 12; i++) rows.push(newRow());
    next = 0; scroll = H * 0.58; speed = Math.max(260, H * .4); score = 0; flash = 0; fx = []; bad = null; mi = 0;
    melody = 5; $('score').textContent = 0; state = 'play';
  }
  const rowY = i => scroll - i * rowH;

  function nextNote() {
    // pentatonic random walk with a gentle pull toward the middle register
    melody += [-2, -1, -1, 0, 1, 1, 2][(Math.random() * 7) | 0]; melody += melody < 3 ? 2 : melody > 11 ? -2 : 0;
    return melody;
  }

  function fail(col, rowIdx) {
    if (state !== 'play') return;
    state = 'over'; bad = { col, row: rowIdx };
    const nb = Arcade.setBest('tiles', score); $('best').textContent = Arcade.best('tiles');
    $('final').textContent = score;
    $('endmsg').innerHTML = nb && score ? '<span class="badge-new">NEW BEST!</span>' : 'Best: ' + Arcade.best('tiles');
    Arcade.tone(200, .5, 'sawtooth', .13, 50);
    flash = 1; setTimeout(() => $('end').classList.add('show'), 700);
  }

  function tap(col, y) {
    if (state !== 'play') return;
    const r = rows[next];
    if (y != null) {
      // find which row band was tapped
      let hitRow = -1;
      for (let i = next; i < next + 6; i++) { const yy = rowY(i); if (y >= yy && y < yy + rowH) { hitRow = i; break; } }
      if (hitRow === -1) return;                  // tapped above/below the active rows: ignore
      if (hitRow !== next || r.col !== col) return fail(col, hitRow);
    } else if (r.col !== col) return fail(col, next);
    r.hit = true; r.hitT = 0; next++; score++; $('score').textContent = score;
    const n = nextNote(); Arcade.note(n, .3, 'triangle', .2); Arcade.note(n + 5, .18, 'sine', .06);
    speed = Math.min(speed + 5, H * 1.3);
    const x = (col + .5) * (W / 4), yy = rowY(next - 1) + rowH / 2;
    for (let i = 0; i < 10; i++) fx.push({ x, y: yy, vx: (Math.random() - .5) * 260, vy: -Math.random() * 220, t: 0, hue: HUES[col] });
    while (rows.length < next + 10) rows.push(newRow());
  }

  cv.addEventListener('pointerdown', e => { const r = cv.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top; tap(Math.min(3, Math.max(0, Math.floor(x / (W / 4)))), y); });
  addEventListener('keydown', e => {
    const c = { d: 0, f: 1, j: 2, k: 3 }[e.key.toLowerCase()];
    if (c !== undefined) tap(c, null);
    if (e.code === 'Space' && $('end').classList.contains('show')) begin();
  });

  function draw() {
    ctx.fillStyle = '#0d0a24'; ctx.fillRect(0, 0, W, H);
    // lane lines
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(i * W / 4, 0); ctx.lineTo(i * W / 4, H); ctx.stroke(); }
    if (!rows) return;
    const cw = W / 4;
    for (let i = Math.max(0, next - 3); i < rows.length; i++) {
      const y = rowY(i); if (y > H + 5) continue; if (y + rowH < 0) break;
      const r = rows[i];
      ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      const x = r.col * cw + 4;
      if (r.hit) {
        ctx.fillStyle = `hsla(${HUES[r.col]},90%,65%,${Math.max(0, .5 - r.hitT * 1.2)})`;
        ctx.fillRect(x, y + 3, cw - 8, rowH - 6);
      } else {
        const act = i === next;
        ctx.save(); ctx.shadowColor = `hsl(${HUES[r.col]} 100% 60%)`; ctx.shadowBlur = act ? 26 : 10;
        const g = ctx.createLinearGradient(0, y, 0, y + rowH); g.addColorStop(0, `hsl(${HUES[r.col]} 95% ${act ? 68 : 56}%)`); g.addColorStop(1, `hsl(${HUES[r.col]} 85% ${act ? 52 : 40}%)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y + 3, cw - 8, rowH - 6, 12) : ctx.rect(x, y + 3, cw - 8, rowH - 6); ctx.fill(); ctx.restore();
        if (i === 0 && next === 0) { ctx.fillStyle = '#0d0a24'; ctx.font = '900 24px "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('TAP', x + (cw - 8) / 2, y + rowH / 2 + 8); }
      }
    }
    if (bad) { // show the mistake in red
      const y = rowY(bad.row), x = bad.col * cw + 4;
      ctx.fillStyle = 'rgba(255,60,80,.7)'; ctx.fillRect(x, y + 3, cw - 8, rowH - 6);
    }
    for (const p of fx) { ctx.fillStyle = `hsla(${p.hue},95%,70%,${Math.max(0, 1 - p.t / .6)})`; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }
    if (flash > 0) { ctx.fillStyle = `rgba(255,60,80,${flash * .35})`; ctx.fillRect(0, 0, W, H); }
    // finish line / danger zone
    const g2 = ctx.createLinearGradient(0, H - 40, 0, H); g2.addColorStop(0, 'rgba(255,60,80,0)'); g2.addColorStop(1, 'rgba(255,60,80,.25)');
    ctx.fillStyle = g2; ctx.fillRect(0, H - 40, W, 40);
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    if (state === 'play') {
      scroll += speed * dt;
      if (rowY(next) > H) fail(rows[next].col, next);
    }
    if (rows) for (const r of rows) if (r.hit) r.hitT += dt;
    if (fx) { for (const p of fx) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; } fx = fx.filter(p => p.t < .6); }
    flash = Math.max(0, flash - dt * 2);
    draw(); requestAnimationFrame(loop);
  })(last);

  function begin() { $('start').classList.remove('show'); $('end').classList.remove('show'); reset(); }
  $('go').onclick = begin; $('again').onclick = begin;
  // idle decoration
  rows = []; for (let i = 0; i < 12; i++) rows.push(newRow()); next = 0; scroll = H * .6; fx = []; flash = 0; bad = null;
})();
</script>
</body>
</html>
